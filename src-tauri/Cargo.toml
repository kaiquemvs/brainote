[package]
name = "brainote"
version = "1.1.0"
description = "brainote"
authors = []
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "brainote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
uuid = { version = "1.29.3", features = ["v4"] }
chrono = "0.4.45"
tauri-plugin-window-state = "2.5.0"
tauri-winrt-notification = "0.8.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
