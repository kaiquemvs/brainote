[package]
name = "brainote"
version = "0.1.0"
description = "brainote"
authors = []
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "brainote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
